# /etc/mosquitto/conf.d/aquamonitor.conf
# Broker local del Gateway AquaMonitor: solo clientes con usuario y contrasena,
# y cada usuario solo puede usar sus temas (lista de acceso).

per_listener_settings true

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aquamonitor.acl

# La persistencia (mensajes retenidos tras reinicios) ya la activa
# /etc/mosquitto/mosquitto.conf de Debian; repetirla aqui impide arrancar.

log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
