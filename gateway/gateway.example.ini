# Configuracion del Gateway AquaMonitor.
# Copiar como gateway.ini y completar. NO subir gateway.ini a GitHub (tiene claves).
# Cualquier valor se puede sobrescribir con una variable de entorno AQM_<SECCION>_<CLAVE>,
# por ejemplo AQM_UBIDOTS_TOKEN o AQM_IA_GEMINI_API_KEY.

[general]
estacion = est01

[local]
# Broker Mosquitto que corre en la misma Raspberry Pi
host = localhost
port = 1883
user = gateway
password = CAMBIAR_clave_gateway
topic_base = aquamonitor

[ubidots]
enabled = true
host = industrial.api.ubidots.com
# 8883 = MQTT con TLS (recomendado); 1883 = sin cifrar
port = 8883
tls = true
token = BBUS-XXXXXXXXXXXXXXXXXXXXXXXXXXXX
device_label = aquamonitor-est01
# Las mediciones se promedian por intervalo antes de subir (procesamiento local y menos puntos en el plan)
intervalo_s = 60
max_lotes_por_envio = 20
# --- Plan Ubidots STEM (gratuito): max. 10 variables por dispositivo, 4000 puntos/dia, 1 envio/s ---
# Para STEM usar:  intervalo_s = 300, variables = nivel,temp,hum,presion,uv,evap,
#                  device_label_control = aquamonitor-est01-control, min_s_entre_envios = 1.2
# (8 variables x 288 intervalos/dia = 2304 puntos + IA y eventos < 4000)
# Variables promediadas que se suben (de: nivel,temp,hum,presion,uv,evap,tasa,perdida); estado y fallas siempre van
variables = nivel,temp,hum,presion,uv,evap,tasa,perdida
# Dispositivo para silenciar, esp32_online, evento, ia_horas_critico, ia_anomalia, ia_alerta (vacio = el mismo device_label)
device_label_control =
# Segundos minimos entre publicaciones a Ubidots (0 = sin limite)
min_s_entre_envios = 0

[ia]
enabled = true
# Cada cuanto se recalcula (ademas se recalcula en cada cambio de estado o evento)
intervalo_s = 300
# Ventana de historico para la regresion y minimos para pronosticar
ventana_h = 6
min_puntos = 6
min_span_min = 20
# Nivel (%) que se considera critico (umbral de SEQUIA del firmware)
nivel_critico = 20
# Horas de anticipacion para la alerta del pronostico (variable ia_alerta = 1 en Ubidots)
horas_alerta = 72
# Puntaje z robusto para marcar un descenso anormal
umbral_z = 3.5
# Clave de Google AI Studio (vacia = recomendaciones por reglas)
gemini_api_key =
# Modelo estable con cupo gratuito (probado nov-2026). Si da 404/503, listar los disponibles en la wiki 23.
gemini_model = gemini-3.5-flash-lite
# Minimo de segundos entre llamadas si el estado no cambia (cuida el nivel gratuito)
gemini_min_interval_s = 1800

[db]
path = /opt/aquamonitor/data/aquamonitor.db
retencion_dias = 30
